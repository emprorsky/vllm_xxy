<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">CPU保存决策：三道检查</title><desc id="desc">工作集估计超容量、真实驻留接近满且在淘汰、新增完整chunks多于阈值，三项都成立才跳过可选保存。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",sans-serif;fill:#172554} .muted{fill:#475569}</style>
<rect width="1200" height="800" fill="white"/>
<text x="35" y="48" font-size="29" style="fill:#172554" font-weight="bold" text-anchor="start">解决方法：三道检查，全满足才跳过本次大写入</text>
<text x="35" y="84" font-size="22" style="fill:#475569" font-weight="normal" text-anchor="start">主实验：256 tokens为一块，新增超过2块才算“大写入”</text>
<rect x="40" y="120" width="805" height="115" rx="14" fill="#dbeafe" stroke="#cbd5e1"/>
<text x="65" y="163" font-size="25" style="fill:#172554" font-weight="bold" text-anchor="start">① 其他活跃会话，预计会带来太多KV？</text>
<text x="65" y="203" font-size="21" style="fill:#475569" font-weight="normal" text-anchor="start">比较会话竞争量估计与CPU容量，不只看当前HTTP请求数</text>
<line x1="845" y1="177" x2="905" y2="177" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<text x="864" y="163" font-size="21" style="fill:#475569" font-weight="normal" text-anchor="start">否</text>
<rect x="40" y="285" width="805" height="115" rx="14" fill="#dbeafe" stroke="#cbd5e1"/>
<text x="65" y="328" font-size="25" style="fill:#172554" font-weight="bold" text-anchor="start">② CPU真的快满了，而且最近在淘汰？</text>
<text x="65" y="368" font-size="21" style="fill:#475569" font-weight="normal" text-anchor="start">实际驻留至少95%，近期容量淘汰，观测状态还要新鲜</text>
<line x1="845" y1="342" x2="905" y2="342" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<text x="864" y="328" font-size="21" style="fill:#475569" font-weight="normal" text-anchor="start">否</text>
<rect x="40" y="450" width="805" height="115" rx="14" fill="#dbeafe" stroke="#cbd5e1"/>
<text x="65" y="493" font-size="25" style="fill:#172554" font-weight="bold" text-anchor="start">③ 这次要新增保存超过2个完整块？</text>
<text x="65" y="533" font-size="21" style="fill:#475569" font-weight="normal" text-anchor="start">只算CPU还没有的完整前缀块，不重复算已有部分</text>
<line x1="845" y1="507" x2="905" y2="507" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<text x="864" y="493" font-size="21" style="fill:#475569" font-weight="normal" text-anchor="start">否</text>
<line x1="440" y1="235" x2="440" y2="282" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<text x="456" y="264" font-size="21" style="fill:#475569" font-weight="normal" text-anchor="start">是</text>
<line x1="440" y1="400" x2="440" y2="447" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<text x="456" y="429" font-size="21" style="fill:#475569" font-weight="normal" text-anchor="start">是</text>
<rect x="925" y="120" width="235" height="445" rx="14" fill="#dcfce7" stroke="#cbd5e1"/>
<text x="1042" y="304" font-size="29" style="fill:#166534" font-weight="bold" text-anchor="middle">正常保存</text>
<text x="1042" y="348" font-size="22" style="fill:#166534" font-weight="normal" text-anchor="middle">不主动过滤</text>
<line x1="440" y1="565" x2="440" y2="614" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<text x="456" y="595" font-size="21" style="fill:#475569" font-weight="normal" text-anchor="start">是</text>
<rect x="40" y="625" width="805" height="78" rx="14" fill="#fee2e2" stroke="#cbd5e1"/>
<text x="442" y="674" font-size="25" style="fill:#b91c1c" font-weight="bold" text-anchor="middle">跳过本请求的可选保存，仍正常计算和返回</text>
<text x="40" y="755" font-size="22" style="fill:#475569" font-weight="normal" text-anchor="start">状态缺失或超过5秒：恢复正常保存；已有缓存的加载不受这个保存开关禁止。</text>
</svg>
